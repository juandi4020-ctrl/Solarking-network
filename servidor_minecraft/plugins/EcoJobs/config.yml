level-gui:
  progression-slots:
    next-page:
      material: arrow
      name: '&fNext Page'
      location:
        column: 6
        row: 6
    pattern:
    - 109ab0jkl
    - 2080c0i0m
    - 3070d0h0n
    - 4560efg0o
    - 00000000p
    - 00000000q
    in-progress:
      item: yellow_stained_glass_pane
      lore:
      - '&f'
      - '&fRewards:'
      - '%rewards%'
      - '&f'
      - '&fProgress:'
      - '&8» &e%percentage_progress%%'
      - '&8» &e%current_xp%&8/&7%required_xp% &fXP'
      name: '%job% &fLvl. &a%level%'
    unlocked:
      item: lime_stained_glass_pane
      lore:
      - '&f'
      - '&fRewards:'
      - '%rewards%'
      - '&f'
      - '&aUNLOCKED'
      name: '%job% &fLvl. &a%level%'
    level-as-amount: true
    locked:
      item: red_stained_glass_pane
      lore:
      - '&f'
      - '&fRewards:'
      - '%rewards%'
      name: '%job% &fLvl. &a%level%'
    close:
      material: barrier
      name: '&cClose'
      location:
        column: 5
        row: 6
    prev-page:
      material: arrow
      name: '&fPrevious Page'
      location:
        column: 4
        row: 6
  custom-slots: []
  rows: 6
  title: '%job%'
  close:
    material: barrier
    name: '&cClose'
    location:
      column: 5
      row: 6
  mask:
    pattern:
    - '111111111'
    - '111111111'
    - '111111111'
    - '111111111'
    - '111111111'
    - '111111111'
    materials:
    - black_stained_glass_pane
jobs:
  limit: 3
level-up:
  message:
    message:
    - '&f'
    - ' &#964B00You levelled up %job%&#964B00 to &eLevel %level%&#964B00!'
    - '&f'
    - ' &#964B00&lREWARDS:'
    - ' %level_up_messages%'
    - '&f'
    enabled: true
  sound:
    id: entity_player_levelup
    pitch: 1.3
    enabled: true
leave-gui:
  cancel:
    item: arrow
    lore:
    - ''
    - '&fGo back to the Jobs menu'
    name: '&eCancel'
    location:
      column: 3
      row: 2
  custom-slots: []
  rows: 3
  title: Confirm Leaving %job%
  confirm:
    item: player_head texture:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTRiZDlhNDViOTY4MWNlYTViMjhjNzBmNzVhNjk1NmIxZjU5NGZlYzg0MGI5NjA3Nzk4ZmIxZTcwNzc2NDQzMCJ9fX0=
    lore:
    - ''
    - '&cAre you sure?'
    - '%leave_lore%'
    name: '&cLeave %job%'
    location:
      column: 7
      row: 2
  mask:
    pattern:
    - '111111111'
    - '110111011'
    - '111111111'
    materials:
    - black_stained_glass_pane
gui:
  next-page:
    item: arrow
    name: '&fNext Page'
    location:
      column: 6
      row: 6
  custom-slots: []
  rows: 6
  job-area:
    top-left:
      column: 2
      row: 3
    bottom-right:
      column: 8
      row: 5
  player-info:
    no-jobs:
    - ''
    - '&cYou do not currently have a job active'
    - '&fPick one from the options below!'
    - ''
    - '&fYou can have up to &a%ecojobs_limit% &fjobs at once!'
    - ''
    column: 5
    has-jobs:
    - ''
    - '%jobs%'
    - ''
    - '&fJob slots in use: &a%ecojobs_in_jobs%&8/&a%ecojobs_limit%'
    name: '&r%player%&f''s Jobs:'
    row: 1
    job-line:
    - ' %job% &fLvl. &a%level%'
  close:
    item: barrier
    name: '&cClose'
    location:
      column: 5
      row: 6
  mask:
    pattern:
    - '111101111'
    - '111111111'
    - '100000001'
    - '100000001'
    - '100000001'
    - '111101111'
    materials:
    - black_stained_glass_pane
  job-icon:
    lore:
    - '%description%'
    - '&f'
    - '&fJob Rewards:'
    - '%effects%'
    - ''
    - '&fProgress:'
    - '&8» &e%percentage_progress%%'
    - '&8» &e%current_xp%&8/&7%required_xp% &fXP'
    active-lore:
    - ''
    - '&eClick to view Level Progression!'
    - '&eRight-click to leave this job!'
    click:
      pitch: 1
      sound: ui_button_click
    join-lore:
    - ''
    - '&eClick to join this job!'
    name: '%job% &fLvl. &a%level%'
    too-many-jobs-lore:
    - ''
    - '&cYou have too many jobs already!'
  prev-page:
    item: arrow
    name: '&fPrevious Page'
    location:
      column: 4
      row: 6
use-local-storage: true

