lore:
  - ""
  - "&8&lʙᴏɴᴏ ᴅᴇ ᴄᴏɴᴊᴜɴᴛᴏ: ᴘᴀꜱᴏ ᴅᴇʟ ᴀʙɪꜱᴍᴏ"
  - ""
  - "&7ꜰᴏʀᴊᴀᴅᴀ ᴄᴏɴ ʟᴀ ᴇꜱᴇɴᴄɪᴀ ᴅᴇʟ ꜰɪɴ ʏ ᴇʟ ᴇᴛᴇʀ."
  - "&7ᴘᴇʀᴍɪᴛᴇ ᴘᴇɴᴇᴛʀᴀʀ ᴇʟ ᴛᴇᴊɪᴅᴏ ᴅᴇ ʟᴀ ʀᴇᴀʟɪᴅᴀᴅ."
  - ""
  - "&f▸ &dꜱʜɪꜰᴛ x2: &7ᴛᴇʟᴇᴛʀᴀɴꜱᴘᴏʀᴛᴀᴄɪᴏɴ ɪɴꜱᴛᴀɴᴛᴀɴᴇᴀ."
  - "&8ɴᴏ ᴘᴜᴇᴅᴇꜱ ᴄᴀᴢᴀʀ ʟᴏ Qᴜᴇ ɴᴏ ᴘᴇʀᴛᴇɴᴇᴄᴇ ᴀ Qᴜɪ."
